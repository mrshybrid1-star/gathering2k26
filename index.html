<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gathering 2K26 · Agape Catalyst Annual Conference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* COLORS (taken from the event flyer). bg = page, paper = card, cream = flyer lettering, olive = flyer background, black = chair */
:root{--bg:#2E2C20;--olive:#4D4834;--olive2:#5C563F;--cream:#D7CEB1;--paper:#ECE7D6;--black:#131618;--text:#1D1C14;--muted:#6A6550;--line:#CFC7AB;--err:#A8261D}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Jost,system-ui,sans-serif;background:linear-gradient(180deg,var(--olive) 0,var(--bg) 70%) fixed;color:var(--text);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:600px;margin:0 auto;padding:30px 20px 40px;min-height:100vh;display:flex;flex-direction:column}
header{color:var(--cream);margin-bottom:22px;display:flex;align-items:center;gap:16px}
#logo{height:72px;width:auto;max-width:96px;object-fit:contain}
.org,.tag{font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:0}
.org{margin-bottom:6px}
header h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(34px,9.5vw,56px);line-height:1;margin:0;letter-spacing:.02em;text-transform:uppercase}
header h1 small{font-size:.4em;letter-spacing:.25em;margin-left:6px;vertical-align:middle;opacity:.85}
.tag{margin-top:10px;opacity:.85}
main{background:var(--paper);border-radius:6px;padding:24px 20px;flex:1;align-self:stretch}
h2{font-family:'Bodoni Moda',serif;font-weight:500;font-size:27px;margin:0 0 6px}
p.sub{margin:0 0 20px;color:var(--muted)}
.hero{display:block;width:calc(100% + 40px);margin:-24px -20px 20px;height:200px;object-fit:cover;object-position:center 60%;border-radius:6px 6px 0 0}
.choices{display:grid;gap:12px}
.choice{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:6px;padding:18px}
.choice b{display:block;font-family:'Bodoni Moda',serif;font-weight:500;font-size:21px;margin-bottom:2px}
.choice small{color:var(--muted);font-size:15px}
.choice:hover{border-color:var(--olive)}
.choice:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--olive2);outline-offset:2px}
.back{all:unset;cursor:pointer;color:var(--olive);font-weight:600;margin-bottom:14px;display:inline-block;padding:6px 0}
label{display:block;font-weight:600;margin:16px 0 6px;font-size:15px}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font:inherit;font-size:17px;padding:14px;border:2px solid var(--line);border-radius:6px;background:#fff;color:var(--text)}
textarea{min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg.three{grid-template-columns:repeat(3,1fr);margin-bottom:22px}
.seg input{position:absolute;opacity:0}
.seg label{margin:0;text-align:center;padding:13px 6px;border:2px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-weight:600}
.seg input:checked+label{background:var(--olive);color:var(--paper);border-color:var(--olive)}
.seg input:focus-visible+label{outline:3px solid var(--olive2);outline-offset:2px}
.day label small{display:block;font-size:12px;opacity:.8;margin-top:1px}
.submit{all:unset;box-sizing:border-box;width:100%;text-align:center;cursor:pointer;margin-top:24px;padding:17px;border-radius:6px;background:var(--black);color:var(--cream);font-family:'Bodoni Moda',serif;font-weight:500;font-size:20px}
.submit.alt{background:none;color:var(--black);border:2px solid var(--black);margin-top:12px}
.submit[disabled]{opacity:.6}
.chk{display:flex;align-items:center;gap:10px;margin:8px 0;padding:12px;background:#fff;border:2px solid var(--line);border-radius:6px;font-weight:500;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--olive)}
details{margin-top:10px}summary{cursor:pointer;color:var(--olive);font-weight:600;padding:6px 0}
.tidy{margin:10px 0;padding:12px;background:#fff;border:2px solid var(--line);border-radius:6px}
.tidy b{display:block;margin-bottom:8px}
.err{color:var(--err);font-size:15px;margin-top:8px}
.hide{display:none!important}
.note{background:#fff;border-left:4px solid var(--olive2);padding:10px 12px;border-radius:4px;font-size:15px;color:var(--muted);margin-bottom:6px}
.privacy{font-size:13px;color:var(--muted);margin:16px 0 0}
.done{text-align:center;padding:26px 0}
.done .mark{width:76px;height:76px;border-radius:50%;background:var(--black);color:var(--cream);display:grid;place-items:center;margin:0 auto 18px;font-size:38px}
.done h2{font-size:32px}
.stamp{font-size:14px;color:var(--muted);margin:-8px 0 18px}
.code{font-family:'Bodoni Moda',serif;font-size:64px;letter-spacing:.12em;background:#fff;border:2px dashed var(--olive2);border-radius:6px;padding:8px 0 8px .12em;margin:6px 0 14px}
.next{all:unset;cursor:pointer;margin:6px 6px 0;display:inline-block;padding:12px 20px;border-radius:6px;border:2px solid var(--black);font-weight:600}
@media (prefers-reduced-motion:no-preference){.done .mark{animation:pop .4s ease-out}@keyframes pop{from{transform:scale(.6);opacity:0}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" src="logo.png" alt="" onerror="this.remove()">
    <div>
      <p class="org">Agape Catalyst Annual Conference</p>
      <h1>The Gathering <small>2K26</small></h1>
      <p class="tag">Three days. One purpose. Eternal impact.</p>

</div>

function people(){
  const m = {};
  Object.entries(ROSTER[day]||{}).forEach(([team,list])=>list.forEach(n=>(m[n]=m[n]||[]).push(team)));
  return m;
}
const allTeams = () => [...new Set(Object.values(ROSTER).flatMap(d=>Object.keys(d)))].sort();

}

/* ---------------- Guests ---------------- */
function guestType(){
  screen(`<h2>Have you been with us before?</h2><p class="sub">This helps us welcome you properly.</p>
  <div class="choices">
    <button class="choice" id="f"><b>This is my first time</b><small>We'd love to get to know you</small></button>
    <button class="choice" id="m"><b>I'm a member of ACTS Church / AWCCI</b><small>Quick check-in</small></button>
    <button class="choice" id="r"><b>I'm not a member, but I'm returning</b><small>Welcome back</small></button>
  </div>`, welcome);
  $('#f').onclick=()=>{state.type='First-timer';guestForm()};
  $('#m').onclick=()=>{state.type='Member (ACTS Church / AWCCI)';guestForm()};
  $('#r').onclick=()=>{state.type='Returning non-member';guestForm()};
}

function guestForm(){
  const first = state.type==='First-timer';
  screen(`<h2>${first?'Nice to meet you!':'Welcome back!'}</h2><p class="sub">${first?'Tell us a little about you.':'Just a few details.'}</p>
  <form id="f" novalidate>
    <label for="name">Full name</label><input id="name" type="text" autocomplete="name">
    <label for="phone">Telephone</label><input id="phone" type="tel" autocomplete="tel">
    <label>Are you ministering in today's program?</label>
    <div class="seg"><input type="radio" name="min" id="my" value="Yes"><label for="my">Yes</label><input type="radio" name="min" id="mn" value="No" checked><label for="mn">No</label></div>
    <div id="mrw" class="hide"><label for="mr">What will you be doing? <small>(optional)</small></label><select id="mr">${opt(MINISTRY)}</select></div>
    <div class="${first?'':'hide'}">
      <label for="email">Email</label><input id="email" type="email" autocomplete="email">
      <label>Do you have a home church?</label>
      <div class="seg"><input type="radio" name="home" id="hy" value="Yes"><label for="hy">Yes</label><input type="radio" name="home" id="hn" value="No"><label for="hn">No</label></div>
      <div id="hcw" class="hide"><label for="hc">Which church?</label><input id="hc" type="text"></div>
      <label for="heard">How did you hear about this event?</label><select id="heard">${opt(HEARD)}</select>
      <div id="invw" class="hide"><label for="inv">Who invited you?</label><input id="inv" type="text"></div>
      <label for="prayer">How can we pray for you? <small>(optional)</small></label><textarea id="prayer"></textarea>
      <p class="privacy">${PRIVACY}</p>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="submit" type="submit">Check me in</button>
  </form>`, guestType);
  $('#heard').onchange=e=>$('#invw').classList.toggle('hide',!e.target.value.startsWith('Invited'));
  document.querySelectorAll('[name=min]').forEach(r=>r.onchange=()=>$('#mrw').classList.toggle('hide',!$('#my').checked));
  document.querySelectorAll('[name=home]').forEach(r=>r.onchange=()=>$('#hcw').classList.toggle('hide',!$('#hy').checked));
  $('#f').onsubmit=e=>{
    e.preventDefault();
    const v=id=>($('#'+id)?.value||'').trim();
    const d={action:'Check-in',role:'Guest',type:state.type,name:v('name'),phone:v('phone'),ministering:document.querySelector('[name=min]:checked')?.value||'No'};
    if(d.ministering==='Yes') d.ministryRole=v('mr');
    let err='';
    if(d.name.length<2) err='Please enter your full name.';
    else if(digits(d.phone).length<7) err='Please enter a valid telephone number.';
    if(first&&!err){
      Object.assign(d,{email:v('email'),homeChurch:document.querySelector('[name=home]:checked')?.value||'',homeChurchName:v('hc'),heardFrom:v('heard'),invitedBy:v('inv'),prayer:v('prayer')});
      if(!/^\S+@\S+\.\S+$/.test(d.email)) err='Please enter a valid email address.';
      else if(!d.homeChurch) err='Please tell us if you have a home church.';
      else if(!d.heardFrom) err='Please tell us how you heard about the event.';
    }
    send(d,err);
  };
}

/* ---------------- Volunteers ---------------- */
function volunteerMenu(){
  screen(`<h2>Volunteer station</h2><p class="sub">${day}. What would you like to do?</p>
  <div class="choices">
    <button class="choice" id="ci"><b>Check in</b><small>I've arrived for my shift</small></button>
    <button class="choice" id="co"><b>Check out</b><small>I've finished and I'm heading out</small></button>
  </div>`, welcome);
  $('#ci').onclick=()=>volunteerForm('Check-in');
  $('#co').onclick=()=>volunteerForm('Check-out');
}

function volunteerForm(action){
  const out = action==='Check-out', P = people(), names = Object.keys(P).sort();
  screen(`<h2>${out?'Before you go':'Thanks for serving!'}</h2><p class="sub">${out?'A quick wrap-up so the next team starts well.':'Find your name to check in.'}</p>
  ${names.length?'':`<div class="note">The ${day} volunteer list hasn't been added yet. Enter your details below.</div>`}
  <form id="f" novalidate>
    <label for="who">Your name</label>
    <select id="who">${opt(names,'Select your name…')}<option value="__other">My name isn't listed</option></select>
    <div id="manual" class="${names.length?'hide':''}">
      <label for="name">Full name</label><input id="name" type="text" autocomplete="name">
      <label for="phone">Telephone</label><input id="phone" type="tel" autocomplete="tel">
    </div>
    <div id="stw"></div>
    ${out?`<div id="tidy"></div>
    <label for="concerns">Anything you'd like to share with the leaders? <small>(optional)</small></label>
    <textarea id="concerns" placeholder="Concerns, feedback or anything that needs follow-up"></textarea>`:''}
    <div class="err" id="err" role="alert"></div>
    <button class="submit" type="submit">${out?'Check me out':'Check me in'}</button>
  </form>`, volunteerMenu);

  const chosen=()=>[...document.querySelectorAll('#stw [name=st]:checked')].map(x=>x.value)
    .concat(($('#oth')?.value||'').split(/[,\/;]/).map(x=>x.trim()).filter(Boolean)).filter((x,i,a)=>a.indexOf(x)===i);

  const drawTidy=()=>{
    if(!out) return;
    const box=$('#tidy'), prev={};
    box.querySelectorAll('[data-st]').forEach(el=>prev[el.dataset.st]={ok:el.querySelector('input:checked')?.value,why:el.querySelector('textarea').value});
    const sts=chosen();
    box.innerHTML=sts.length?sts.map((st,i)=>`<div class="tidy" data-st="${esc(st)}"><b>Did you leave ${sts.length>1?'your '+esc(st)+' station':'your station'} tidy?</b>
      <div class="seg"><input type="radio" name="ok${i}" id="y${i}" value="Yes"><label for="y${i}">Yes</label><input type="radio" name="ok${i}" id="n${i}" value="No"><label for="n${i}">No</label></div>
      <div class="why hide"><label for="w${i}">Please tell us why</label><textarea id="w${i}" placeholder="e.g. equipment still out, supplies running low"></textarea></div></div>`).join(''):'';
    box.querySelectorAll('[data-st]').forEach((el,i)=>{
      const p=prev[el.dataset.st]||{};
      if(p.ok){ el.querySelector('input[value='+p.ok+']').checked=true; }
      el.querySelector('textarea').value=p.why||'';
      const sync=()=>el.querySelector('.why').classList.toggle('hide',!el.querySelector('#n'+i).checked);
      el.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=sync); sync();
    });
  };

  const drawStations=()=>{
    const w=$('#who').value, other=w==='__other'||!names.length;
    $('#manual').classList.toggle('hide',!other);
    if(!w&&names.length){ $('#stw').innerHTML=''; if(out) $('#tidy').innerHTML=''; return; }
    const mine=other?[]:P[w], rest=allTeams().filter(t=>!mine.includes(t));
    const box=(t,c)=>`<label class="chk"><input type="checkbox" name="st" value="${esc(t)}" ${c?'checked':''}>${esc(t)}</label>`;
    $('#stw').innerHTML=`<label>Which station(s) are you serving at today?</label>`+
      (mine.length?mine.map(t=>box(t,true)).join('')+`<details><summary>Serving at another station too?</summary>${rest.map(t=>box(t,false)).join('')}</details>`:rest.map(t=>box(t,false)).join(''))+
      `<label for="oth">Another station not listed <small>(optional, separate with commas)</small></label><input id="oth" type="text">`;
    $('#stw').querySelectorAll('[name=st]').forEach(x=>x.onchange=drawTidy); $('#oth').oninput=drawTidy;
    drawTidy();
  };
  $('#who').onchange=drawStations; drawStations();

  $('#f').onsubmit=e=>{
    e.preventDefault();
    const v=id=>($('#'+id)?.value||'').trim(), w=$('#who').value, other=w==='__other'||!names.length, sts=chosen();
    const d={action,role:'Volunteer',type:'Volunteer',name:other?v('name'):w,phone:other?v('phone'):'',team:sts.join(', ')};
    let err='';
    if(!w&&names.length) err='Please select your name.';
    else if(other&&d.name.length<2) err='Please enter your full name.';
    else if(other&&digits(d.phone).length<7) err='Please enter a valid telephone number.';
    else if(!sts.length) err='Please choose at least one station.';
    if(out&&!err){
      const bl=[...document.querySelectorAll('#tidy [data-st]')].map(el=>({st:el.dataset.st,ok:el.querySelector('input:checked')?.value,why:el.querySelector('textarea').value.trim()}));
      const miss=bl.find(b=>!b.ok), nowhy=bl.find(b=>b.ok==='No'&&!b.why);
      if(miss) err=`Please tell us if ${bl.length>1?'your '+miss.st+' station':'your station'} was left tidy.`;
      else if(nowhy) err=`Please tell us why ${bl.length>1?'your '+nowhy.st+' station':'your station'} wasn't left tidy.`;
      else {
        const bad=bl.filter(b=>b.ok==='No');
        d.stationStatus=bad.length?'No':'Yes';
        d.stationNotes=bad.map(b=>(bl.length>1?b.st+': ':'')+b.why).join('; ');
        d.concerns=v('concerns');
      }
    }
    send(d,err);
  };
}

/* ---------------- Children ---------------- */
function kidsMenu(){
  screen(`<h2>Children's check-in</h2><p class="sub">${day}. Ages 13 and up can check in as guests.</p>
  <div class="choices">
    <button class="choice" id="ki"><b>Check in a child</b><small>You'll get a pickup code</small></button>
    <button class="choice" id="kp"><b>Pick up a child</b><small>Have your pickup code ready</small></button>
  </div>`, welcome);
  $('#ki').onclick=()=>kidForm();
  $('#kp').onclick=()=>pickupForm();
}

function kidForm(){
  const p = lastParent||{};
  screen(`<h2>Check in a child</h2><p class="sub">For children under 13. A parent or guardian should complete this.</p>
  <form id="f" novalidate>
    <label for="name">Child's name</label><input id="name" type="text">
    <label for="age">Age or grade</label><input id="age" type="text">
    <label for="parent">Parent or guardian name</label><input id="parent" type="text" value="${esc(p.parent)}">
    <label for="phone">Parent telephone</label><input id="phone" type="tel" value="${esc(p.phone)}">
    <label for="med">Allergies or medical needs <small>(optional)</small></label><textarea id="med"></textarea>
    <label for="pp">Anyone else allowed to pick up? <small>(optional)</small></label><input id="pp" type="text" value="${esc(p.pickupPerson)}">
    <p class="privacy">${PRIVACY} Children are released only with the pickup code and the parent's telephone number.</p>
    <div class="err" id="err" role="alert"></div>
    <button class="submit" type="submit">Check in child</button>
  </form>`, kidsMenu);
  $('#f').onsubmit=e=>{
    e.preventDefault();
    const v=id=>($('#'+id)?.value||'').trim();
    const d={action:'Child check-in',role:'Child',type:'Child',name:v('name'),childAge:v('age'),parent:v('parent'),phone:v('phone'),medical:v('med'),pickupPerson:v('pp')};
    let err='';
    if(d.name.length<2) err="Please enter the child's name.";
    else if(!d.childAge) err="Please enter the child's age or grade.";
    else if(d.parent.length<2) err="Please enter the parent or guardian's name.";
    else if(digits(d.phone).length<7) err="Please enter a valid telephone number.";
    lastParent={parent:d.parent,phone:d.phone,pickupPerson:d.pickupPerson};
    send(d,err);
  };
}

function pickupForm(){
  screen(`<h2>Pick up a child</h2><p class="sub">Enter the pickup code from check-in and the parent's telephone number.</p>
  <form id="f" novalidate>
    <label for="code">Pickup code</label><input id="code" type="text" inputmode="numeric" maxlength="4" autocomplete="off">
    <label for="phone">Parent telephone</label><input id="phone" type="tel">
    <div class="err" id="err" role="alert"></div>
    <button class="submit" type="submit">Find my child</button>
  </form>`, kidsMenu);
  $('#f').onsubmit=e=>{
    e.preventDefault();
    const d={action:'Child pick-up',role:'Child',type:'Child',code:$('#code').value.trim(),phone:$('#phone').value.trim()};
    let err='';
    if(!/^\d{4}$/.test(d.code)) err='The pickup code has 4 digits.';
    else if(digits(d.phone).length<7) err="Please enter the parent's telephone number.";
    send(d,err);
  };
}

/* ---------------- Sending ---------------- */
async function send(d,err){
  if(err){ $('#err').textContent=err; return; }
  d.day=day; d.clientTime=stamp();
  const btn=document.querySelector('.submit'), label=btn.textContent; btn.disabled=true; btn.textContent='Saving…';
  try{
    const r=await fetch(API,{method:'POST',body:JSON.stringify(d)});
    const j=await r.json();
    if(!r.ok||j.error&&j.ok!==false) throw 0;
    if(j.ok===false){ btn.disabled=false; btn.textContent=label; $('#err').textContent="We couldn't find a child with that code and telephone number. Please check both and try again."; return; }
    if(j.duplicate) return dupScreen(d,j);
    if(j.code) d.code=j.code;
    done(d,j);
  }catch{
    btn.disabled=false; btn.textContent=label;
    $('#err').textContent="We couldn't save this. Check the connection and tap the button again.";
  }
}

function dupScreen(d,j){
  const what = d.action==='Check-out'?'checked out':'checked in';
  screen(`<div class="done"><h2>Already ${what} today</h2>
  <p class="sub">We have ${esc(d.name)} ${what} at ${esc(j.when)}.</p>
  <button class="submit" id="ok">That's me, I'm all set</button>
  <button class="submit alt" id="again">${what==='checked in'?'Check in again anyway':'Check out again anyway'}</button></div>`);
  $('#ok').onclick=welcome;
  $('#again').onclick=async()=>{
    try{ const r=await fetch(API,{method:'POST',body:JSON.stringify({...d,force:true})}); const k=await r.json(); if(!r.ok) throw 0; if(k.code) d.code=k.code; done(d,k); }
    catch{ $('#again').textContent="Couldn't save. Tap to try again."; }
  };
}

function done(d,j={}){
  const first=(d.name||'').split(' ')[0], out=d.action==='Check-out';
  let title=`You're in, ${esc(first)}!`, msg='', extra='', wait=12000;
  if(d.role==='Child'&&d.action==='Child check-in'){
    title=`${esc(first)} is checked in`; wait=90000;
    msg='Keep this code. You will need it, with your telephone number, to pick up your child.';
    extra=`<div class="code">${esc(d.code)}</div><button class="next" id="more">Check in another child</button>`;
  } else if(d.action==='Child pick-up'){
    title=j.already?'Already picked up':'Ready for pickup'; wait=20000;
    msg=j.already?`${esc(j.childName)} was already picked up. Please see a team member if this is a surprise.`:`Please release ${esc(j.childName)} to this parent.`;
  } else if(out){ title=`See you soon, ${esc(first)}!`; msg='Thank you for serving today. Travel safe!'; }
  else if(d.ministering==='Yes') msg='Thank you for ministering. Please let the protocol team know you have arrived.';
  else if(d.type==='First-timer') msg="We're so happy you came. Someone from our team will say hello.";
  else if(d.role==='Volunteer') msg=`Head to your station${d.team?': '+esc(d.team):''}.`;
  else msg='Enjoy The Gathering!';
  const stampLine = d.role==='Child'&&d.action==='Child pick-up' ? '' : `<p class="stamp">${esc(d.action)} · ${day} · ${esc(d.clientTime)}</p>`;
  screen(`<div class="done"><div class="mark">✓</div><h2>${title}</h2>${stampLine}<p class="sub">${msg}</p>${extra}<button class="next" id="n">Back to start</button></div>`);
  $('#n').onclick=welcome;
  if($('#more')) $('#more').onclick=kidForm;
  state.timer=setTimeout(welcome,wait);
}
welcome();
</script>
</body>
</html>
